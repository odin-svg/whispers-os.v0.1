name: Build Whispers-OS ISO

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install live-build
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build

      - name: Configure Live Build
        run: |
          sudo lb config \
            --architectures amd64 \
            --distribution bookworm \
            --archive-areas "main contrib non-free non-free-firmware" \
            --bootappend-live "boot=live components quiet splash" \
            --iso-application "Whispers OS" \
            --iso-volume "WHISPERS_OS"

      - name: Build ISO
        run: |
          sudo lb build 2>&1 | tee build.log
          sudo mv live-image-amd64.hybrid.iso Whispers-OS.iso

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Whispers-OS
          path: Whispers-OS.iso
          retention-days: 14

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          files: Whispers-OS.iso
          name: Whispers OS Build
          tag_name: build-${{ github.run_number }}
